databaseChangeLog:
  - changeSet:
      id: 001-create-system-meta
      author: copilot
      changes:
        - createTable:
            tableName: system_meta
            columns:
              - column:
                  name: key
                  type: varchar(100)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: value
                  type: text
                  constraints:
                    nullable: false

  - changeSet:
      id: 002-create-roles-and-users
      author: copilot
      changes:
        - createTable:
            tableName: roles
            columns:
              - column:
                  name: code
                  type: varchar(100)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: label
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: position
                  type: integer
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: varchar(64)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: username
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: full_name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: first_name
                  type: varchar(255)
              - column:
                  name: last_name
                  type: varchar(255)
              - column:
                  name: email
                  type: varchar(320)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: employee_id
                  type: varchar(100)
              - column:
                  name: department
                  type: varchar(255)
              - column:
                  name: job_title
                  type: varchar(255)
              - column:
                  name: phone_number
                  type: varchar(50)
              - column:
                  name: manager_id
                  type: varchar(64)
              - column:
                  name: locale
                  type: varchar(20)
                  defaultValue: fr-FR
                  constraints:
                    nullable: false
              - column:
                  name: timezone
                  type: varchar(100)
                  defaultValue: Africa/Dakar
                  constraints:
                    nullable: false
              - column:
                  name: role
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: password_hash
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: is_active
                  type: boolean
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(30)
                  defaultValue: active
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: last_login_at
                  type: timestamp
              - column:
                  name: position
                  type: integer
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
        - createTable:
            tableName: user_roles
            columns:
              - column:
                  name: user_id
                  type: varchar(64)
                  constraints:
                    primaryKey: true
                    nullable: false
                    foreignKeyName: fk_user_roles_user
                    referencedTableName: users
                    referencedColumnNames: id
                    deleteCascade: true
              - column:
                  name: role
                  type: varchar(100)
                  constraints:
                    primaryKey: true
                    nullable: false
                    foreignKeyName: fk_user_roles_role
                    referencedTableName: roles
                    referencedColumnNames: code
              - column:
                  name: position
                  type: integer
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
