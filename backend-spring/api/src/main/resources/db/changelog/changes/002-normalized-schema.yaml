databaseChangeLog:
  - changeSet:
      id: 002-create-normalized-tables
      author: copilot
      changes:
        - createTable:
            tableName: roles
            columns:
              - column:
                  name: code
                  type: TEXT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: label
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: position
                  type: INTEGER
                  constraints:
                    nullable: false

        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: TEXT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: username
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: full_name
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: role
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: password_hash
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: is_active
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TEXT
              - column:
                  name: updated_at
                  type: TEXT
              - column:
                  name: last_login_at
                  type: TEXT

        - createTable:
            tableName: user_roles
            columns:
              - column:
                  name: user_id
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: role_code
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: position
                  type: INTEGER
                  constraints:
                    nullable: false

        - addPrimaryKey:
            tableName: user_roles
            columnNames: user_id, role_code
            constraintName: pk_user_roles

        - createTable:
            tableName: directions
            columns:
              - column:
