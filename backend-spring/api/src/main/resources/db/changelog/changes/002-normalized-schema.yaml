              - column:
                  name: position
                  type: INTEGER
                  constraints:
                    nullable: false

        - addPrimaryKey:
            tableName: workflow_assignments
            columnNames: step, workflow_type, user_id
            constraintName: pk_workflow_assignments

        - createTable:
