databaseChangeLog:
  - changeSet:
      id: 001-create-app-state
      author: copilot
      changes:
        - createTable:
            tableName: app_state
            columns:
              - column:
                  name: id
                  type: TEXT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: payload
                  type: TEXT
                  constraints:
                    nullable: false
